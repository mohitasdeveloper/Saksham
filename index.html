<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saksham - The Catalyst</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/cXF30tPQ/LOGO-SAKSHAM-jpg.jpg">
</head>
<body>

    <nav class="navbar">
        <div class="brand-section">
            <img src="https://i.ibb.co/cXF30tPQ/LOGO-SAKSHAM-jpg.jpg" alt="Logo" class="logo-placeholder">
            <div class="brand-name">
                <span class="brand-main">Saksham</span>
                <span class="brand-sub">the catalyst</span>
            </div>
        </div>

        <div class="hamburger" id="hamburger" aria-label="Open menu">
            ☰
        </div>

        <div class="nav-links" id="nav-links">
            <div class="close-btn" id="close-btn" aria-label="Close menu">&times;</div>
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Services</a>
            <a href="#">Contact Us</a>  
            <a href="#" class="btn btn-login mobile-only" id="mobile-login" style="display: none;">Login</a>
        </div>

        <div class="nav-actions">
            <button class="btn btn-login">Login</button> 
        </div>
    </nav>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');
        const closeBtn = document.getElementById('close-btn');
        const mobileLogin = document.getElementById('mobile-login');

        // Check window width to toggle mobile login button visibility
        function handleResize() {
            if (window.innerWidth <= 768) {
                mobileLogin.style.display = 'flex';
            } else {
                mobileLogin.style.display = 'none';
                navLinks.classList.remove('active'); // Close sidebar if resizing to desktop
            }
        }

        // Event Listeners
        hamburger.addEventListener('click', () => {
            navLinks.classList.add('active');
        });

        closeBtn.addEventListener('click', () => {
            navLinks.classList.remove('active');
        });

        window.addEventListener('resize', handleResize);
        
        // Initial setup
        handleResize();
    </script>

</body>
</html>
